<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>國小六年級互動學習網 - 首頁</title>
  <style>
    :root {
      --primary: #4361ee;
      --primary-light: #4895ef;
      --secondary: #f72585;
      --accent: #4cc9f0;
      --gold: #ffb703;
      --success: #06d6a0;
      --bg-dark: #0b1329;
      --card-bg: rgba(255, 255, 255, 0.08);
      --card-border: rgba(255, 255, 255, 0.16);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --radius-xl: 26px;
      --radius-lg: 18px;
      --radius-md: 12px;
      --shadow-card: 0 16px 36px rgba(0, 0, 0, 0.45);
      --font-family: 'PingFang TC', 'Microsoft JhengHei', system-ui, -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 50% 12%, #1e1b4b 0%, #0f172a 55%, #050814 100%);
      color: var(--text);
      font-family: var(--font-family);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 20px 60px;
      position: relative;
      overflow-x: hidden;
    }

    /* 背景裝飾光暈 */
    .bg-glow {
      position: absolute;
      width: 480px;
      height: 480px;
      border-radius: 50%;
      filter: blur(120px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.35;
      animation: floatGlow 10s ease-in-out infinite alternate;
    }

    .bg-glow-1 {
      top: -60px;
      left: 12%;
      background: #4361ee;
    }

    .bg-glow-2 {
      top: 260px;
      right: 12%;
      background: #f72585;
      animation-delay: -5s;
    }

    @keyframes floatGlow {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(35px, 25px) scale(1.15); }
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 860px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
    }

    /* 頂部 QR Code 卡片 */
    .qr-hero-card {
      width: 100%;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-xl);
      padding: 32px 24px;
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      overflow: hidden;
      animation: fadeInDown 0.6s ease-out;
    }

    .qr-hero-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #4cc9f0, #f72585, #ffb703);
    }

    .platform-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(76, 201, 240, 0.15);
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 6px 14px;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .main-title {
      font-size: 2.1rem;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #ffffff 0%, #cbd5e1 50%, #93c5fd 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .sub-title {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 22px;
      max-width: 580px;
      line-height: 1.5;
    }

    /* QR Code 圖片樣式與動畫 */
    .qr-wrapper {
      position: relative;
      padding: 14px;
      background: #ffffff;
      border-radius: var(--radius-lg);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4), 0 0 25px rgba(76, 201, 240, 0.35);
      transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: inline-block;
    }

    .qr-wrapper:hover {
      transform: translateY(-4px) scale(1.05);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.5), 0 0 35px rgba(247, 37, 133, 0.5);
    }

    .qr-image {
      display: block;
      width: 175px;
      height: 175px;
      object-fit: contain;
      border-radius: 8px;
    }

    .qr-caption {
      margin-top: 14px;
      font-size: 0.88rem;
      color: var(--accent);
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* 連結導覽按鈕區 (Links Section) */
    .links-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .section-heading {
      font-size: 1.25rem;
      font-weight: 700;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      gap: 10px;
      padding-left: 6px;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 22px;
      width: 100%;
    }

    /* 核心連結卡片 */
    .nav-card {
      position: relative;
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 28px 24px;
      text-decoration: none;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 20px;
      box-shadow: var(--shadow-card);
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      overflow: hidden;
    }

    .nav-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), transparent);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .nav-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.55);
    }

    .nav-card:hover::before {
      opacity: 1;
    }

    /* 電動機卡片風格 */
    .card-motor:hover {
      border-color: var(--accent);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.55), 0 0 25px rgba(76, 201, 240, 0.35);
    }

    /* 展開圖卡片風格 */
    .card-net:hover {
      border-color: var(--gold);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.55), 0 0 25px rgba(255, 183, 3, 0.35);
    }

    .card-icon-box {
      width: 72px;
      height: 72px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      flex-shrink: 0;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
      transition: transform 0.3s ease;
    }

    .card-motor .card-icon-box {
      background: linear-gradient(135deg, #0077b6, #48cae4);
    }

    .card-net .card-icon-box {
      background: linear-gradient(135deg, #f72585, #ffb703);
    }

    .nav-card:hover .card-icon-box {
      transform: scale(1.1) rotate(5deg);
    }

    .card-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .card-badge {
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .card-motor .card-badge { color: var(--accent); }
    .card-net .card-badge { color: var(--gold); }

    .card-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.3;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-desc {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .card-arrow {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 1.2rem;
      flex-shrink: 0;
      transition: all 0.3s ease;
    }

    .card-motor:hover .card-arrow {
      background: var(--accent);
      color: #0b1329;
      transform: translateX(4px);
    }

    .card-net:hover .card-arrow {
      background: var(--gold);
      color: #0b1329;
      transform: translateX(4px);
    }

    /* 頁尾 */
    footer {
      margin-top: 20px;
      font-size: 0.82rem;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.6;
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 680px) {
      .main-title { font-size: 1.6rem; }
      .qr-hero-card { padding: 24px 18px; }
      .qr-image { width: 140px; height: 140px; }
      .cards-grid { grid-template-columns: 1fr; }
      .nav-card { padding: 20px 18px; gap: 16px; }
      .card-icon-box { width: 60px; height: 60px; font-size: 1.8rem; }
      .card-title { font-size: 1.3rem; }
    }
  </style>
</head>
<body>

  <!-- 背景流動動態光暈 -->
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>

  <div class="container">

    <!-- 頂部區塊：放置 qrcode.png 圖示 -->
    <header class="qr-hero-card">
      <div class="platform-badge">
        <span>✨</span> 國小六年級數位探究學習平台
      </div>
      <h1 class="main-title">互動式科學與幾何探索教室</h1>
      <p class="sub-title">請使用手機或平板掃描下方 QR Code，或點選下方單元開始互動體驗！</p>

      <!-- 首頁上方放 qrcode.png 圖示 -->
      <div class="qr-wrapper">
        <img src="qrcode.png" alt="掃描 QR Code 進入學習網" class="qr-image">
      </div>
      <div class="qr-caption">
        <span>📷</span> 手機掃描 QR Code 隨身互動
      </div>
    </header>

    <!-- 核心連結區塊：電動機 (a1.html) 與 展開圖 (a2.html) -->
    <section class="links-section">
      <h2 class="section-heading">
        <span>🚀</span> 學習單元導覽
      </h2>

      <div class="cards-grid">
        <!-- 連結 1：電動機 會連結到 a1.html -->
        <a href="a1.html" class="nav-card card-motor" title="前往電動機互動模擬">
          <div class="card-icon-box">⚡</div>
          <div class="card-info">
            <span class="card-badge">自然科學・電磁作用</span>
            <h3 class="card-title">電動機</h3>
            <p class="card-desc">探索直流馬達運轉原理：永久磁鐵、電樞線圈、換向器與電流方向動態模擬！</p>
          </div>
          <div class="card-arrow">➜</div>
        </a>

        <!-- 連結 2：展開圖 會連結到 a2.html -->
        <a href="a2.html" class="nav-card card-net" title="前往展開圖立體幾何">
          <div class="card-icon-box">📦</div>
          <div class="card-info">
            <span class="card-badge">數學幾何・空間透視</span>
            <h3 class="card-title">展開圖</h3>
            <p class="card-desc">立體幾何展開與摺疊動態：正方體、長方體、角柱、圓柱與角錐 3D 互動探索！</p>
          </div>
          <div class="card-arrow">➜</div>
        </a>
      </div>
    </section>

    <!-- 頁尾版權 -->
    <footer>
      國小六年級自然與數學科互動數位教材<br>
      支援電腦鍵盤、滑鼠及行動裝置觸控操作
    </footer>

  </div>

</body>
</html>
