<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>音樂魔法教室｜六年級樂器互動</title>
<style>
:root{
  --ink:#24324a; --muted:#66738b; --paper:#fffdf7; --cream:#fff4d8;
  --blue:#6d9dfc; --purple:#8b75e8; --pink:#f47eaa; --yellow:#ffd86b;
  --green:#68c8a0; --shadow:0 18px 45px rgba(53,55,92,.14);
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  background:
    radial-gradient(circle at 10% 10%,#fff2a8 0 7%,transparent 8%),
    radial-gradient(circle at 92% 15%,#cde8ff 0 8%,transparent 9%),
    linear-gradient(145deg,#f5f0ff,#eef8ff 48%,#fff9e8);
  overflow-x:hidden;
}
body:before,body:after{
  content:"";position:fixed;border-radius:50%;filter:blur(2px);opacity:.45;z-index:-1;
}
body:before{width:280px;height:280px;background:#ffd5e7;left:-120px;bottom:4%}
body:after{width:330px;height:330px;background:#d8d0ff;right:-150px;top:48%}
.app{width:min(1180px,94vw);margin:auto;padding:28px 0 42px}
.hero{
  display:flex;align-items:center;justify-content:space-between;gap:22px;
  background:rgba(255,255,255,.78);border:2px solid rgba(255,255,255,.9);
  backdrop-filter:blur(12px);border-radius:30px;padding:22px 26px;box-shadow:var(--shadow);
}
.brand{display:flex;align-items:center;gap:15px}
.logo{
  width:64px;height:64px;border-radius:20px;display:grid;place-items:center;
  font-size:35px;background:linear-gradient(135deg,#7d72ed,#72b6ff);
  box-shadow:0 9px 20px rgba(104,102,225,.25);transform:rotate(-4deg)
}
h1{margin:0;font-size:clamp(24px,4vw,38px);letter-spacing:.03em}
.subtitle{margin:5px 0 0;color:var(--muted);font-size:15px}
.badge{
  padding:10px 15px;border-radius:999px;background:#fff7d4;color:#80621c;
  font-weight:800;white-space:nowrap
}
.grid{display:grid;grid-template-columns:300px 1fr;gap:20px;margin-top:20px}
.card{
  background:rgba(255,255,255,.88);border:1px solid rgba(255,255,255,.9);
  border-radius:26px;box-shadow:var(--shadow);padding:20px
}
.card h2{font-size:19px;margin:0 0 15px}
.instrument-list{display:grid;gap:11px}
.inst{
  border:2px solid #edf0f7;background:#fbfcff;border-radius:18px;padding:12px;
  cursor:pointer;display:flex;align-items:center;gap:12px;transition:.22s;
  color:var(--ink);text-align:left;width:100%;font:inherit
}
.inst:hover{transform:translateX(4px);border-color:#cbd4ff;background:#f8f7ff}
.inst.active{background:linear-gradient(135deg,#eeeaff,#edf7ff);border-color:#887bea;box-shadow:0 7px 18px rgba(107,99,207,.14)}
.inst-icon{font-size:29px;width:42px;text-align:center}
.inst strong{display:block;font-size:16px}.inst small{color:var(--muted)}
.tip{
  margin-top:16px;padding:14px;border-radius:17px;background:#fff8dd;border:1px dashed #e5c965;
  color:#6f5b25;font-size:13px;line-height:1.7
}
.stage{min-height:520px;display:flex;flex-direction:column}
.stage-top{display:flex;align-items:flex-start;justify-content:space-between;gap:15px}
#instrumentName{margin:0;font-size:28px}.desc{color:var(--muted);margin:5px 0 0;font-size:14px}
.controls{display:flex;align-items:center;gap:9px;flex-wrap:wrap;justify-content:flex-end}
.control-btn{
  border:0;border-radius:13px;padding:10px 13px;background:#f0f3fa;color:var(--ink);
  cursor:pointer;font-weight:800;transition:.18s
}.control-btn:hover{transform:translateY(-2px)}
.volume{display:flex;align-items:center;gap:7px;background:#f6f7fb;padding:8px 11px;border-radius:13px}
input[type=range]{accent-color:#786fe2;width:90px}
.playground{
  position:relative;flex:1;min-height:365px;margin-top:18px;overflow:hidden;border-radius:25px;
  background:linear-gradient(160deg,#dceaff,#f0e8ff 48%,#fff0da);
  border:2px solid #fff;box-shadow:inset 0 0 45px rgba(89,93,165,.09)
}
.stars{position:absolute;inset:0;pointer-events:none}
.star{position:absolute;font-size:18px;opacity:.5;animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-12px) rotate(10deg);opacity:.9}}
.instrument-wrap{position:absolute;inset:30px;display:grid;place-items:center}
.instrument-art{position:relative;cursor:pointer;user-select:none;filter:drop-shadow(0 18px 15px rgba(45,52,88,.16));transition:.15s}
.instrument-art:active{transform:scale(.96) rotate(-1deg)}
.pulse{animation:hit .35s ease}
@keyframes hit{0%{transform:scale(1)}40%{transform:scale(1.08) rotate(-2deg)}100%{transform:scale(1)}}

/* piano */
.piano{width:min(600px,85%);height:190px;border-radius:18px 18px 12px 12px;background:#30374a;padding:14px;display:flex;align-items:stretch;gap:2px}
.white-key{height:160px;flex:1;background:#fff;border-radius:0 0 9px 9px;border:1px solid #ccd0da;box-shadow:0 5px 0 #c8cad2;cursor:pointer}
.white-key:active,.white-key.on{background:#dce6ff;transform:translateY(5px);box-shadow:none}
.black-key{position:absolute;top:12px;width:8%;height:98px;background:#252b3a;border-radius:0 0 8px 8px;box-shadow:0 5px 0 #151925;cursor:pointer}
.b1{left:13%}.b2{left:27%}.b3{left:48%}.b4{left:62%}.b5{left:76%}
/* drum */
.drum{width:300px;height:190px;border-radius:50%;background:radial-gradient(circle,#fff1a5 0 20%,#ffcf64 21% 48%,#ed8d70 49% 72%,#a45c7d 73%);border:13px solid #7b5572;box-shadow:inset 0 0 0 8px #ffe5a1}
.drum:after{content:"DRUM";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-weight:900;color:#9b6470;letter-spacing:4px}
.stick{position:absolute;width:14px;height:170px;background:#bd845d;border-radius:20px;transform:rotate(25deg);top:-60px;left:70px;opacity:.9}.stick.r{transform:rotate(-25deg);left:auto;right:70px}
/* guitar */
.guitar{width:260px;height:310px;position:relative}
.guitar .neck{position:absolute;width:58px;height:185px;background:#9b674b;left:101px;top:0;border-radius:12px}
.guitar .head{position:absolute;width:72px;height:40px;background:#754d42;left:94px;top:-12px;border-radius:12px}
.guitar .body{position:absolute;width:215px;height:200px;background:radial-gradient(circle at 50% 42%,#ffe39a 0 8%,#d98248 9% 45%,#9e543f 46% 100%);left:23px;top:105px;border-radius:48% 52% 43% 57%}
.guitar .hole{position:absolute;width:56px;height:56px;border-radius:50%;background:#553b42;left:102px;top:177px;border:6px solid #e6b05e}
.string{position:absolute;width:3px;height:295px;background:rgba(255,255,255,.65);top:-3px;left:112px;transform:rotate(0deg)}
.string.s2{left:120px}.string.s3{left:128px}.string.s4{left:136px}.string.s5{left:144px}.string.s6{left:152px}
/* xylophone */
.xylophone{width:380px;height:240px;position:relative}
.bar{position:absolute;left:30px;right:30px;height:32px;border-radius:10px;box-shadow:0 5px 0 rgba(72,69,91,.2);cursor:pointer;transition:.12s}
.bar:active,.bar.on{transform:translateX(8px);filter:brightness(1.1)}
.bar:nth-child(1){top:8px;background:#ff879f}.bar:nth-child(2){top:47px;background:#ffb15f}.bar:nth-child(3){top:86px;background:#ffe16b}.bar:nth-child(4){top:125px;background:#76d6aa}.bar:nth-child(5){top:164px;background:#72b8ff}.bar:nth-child(6){top:203px;background:#a58bea}
.bar:nth-child(2){left:48px;right:48px}.bar:nth-child(3){left:66px;right:66px}.bar:nth-child(4){left:84px;right:84px}.bar:nth-child(5){left:102px;right:102px}.bar:nth-child(6){left:120px;right:120px}
.mallet{position:absolute;width:12px;height:115px;background:#9d704f;border-radius:20px;right:10px;top:35px;transform:rotate(28deg);transition:.15s}
.mallet:before{content:"";position:absolute;width:30px;height:30px;border-radius:50%;background:#ffe0a1;top:-14px;left:-9px}
.mallet.hit{transform:rotate(5deg) translate(-30px,25px)}
.empty{font-size:70px;opacity:.35}
.action-row{display:flex;justify-content:space-between;align-items:center;margin-top:15px;gap:10px}
.hint{color:var(--muted);font-size:13px}
.score{font-weight:900;background:#fff0a9;border-radius:999px;padding:9px 14px;color:#71591d}
.particles{position:absolute;inset:0;pointer-events:none}
.note{
  position:absolute;font-size:28px;animation:noteUp .9s ease-out forwards;z-index:3;
  text-shadow:0 4px 8px rgba(65,52,105,.16)
}
@keyframes noteUp{0%{opacity:0;transform:translateY(20px) scale(.5)}20%{opacity:1}100%{opacity:0;transform:translateY(-130px) translateX(var(--drift)) rotate(18deg) scale(1.15)}}
.meter{height:9px;background:#eef0f6;border-radius:999px;overflow:hidden;margin-top:10px}.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#70cfa6,#7c8df3,#f28aac);border-radius:inherit;transition:width .25s}
@media(max-width:850px){
  .grid{grid-template-columns:1fr}.instrument-list{grid-template-columns:repeat(2,1fr)}
  .hero{align-items:flex-start}.badge{display:none}.stage{min-height:600px}
}
@media(max-width:520px){
  .app{width:92vw;padding-top:15px}.hero{padding:17px}.logo{width:52px;height:52px;font-size:28px}
  .instrument-list{grid-template-columns:1fr}.stage-top{flex-direction:column}.controls{justify-content:flex-start}
  .piano{height:145px}.white-key{height:120px}.black-key{height:75px}
  .xylophone{transform:scale(.78)}.guitar{transform:scale(.82)}.drum{transform:scale(.8)}
}
</style>
</head>
<body>
<div class="app">
  <header class="hero">
    <div class="brand"><div class="logo">🎵</div><div><h1>音樂魔法教室</h1><p class="subtitle">六年級・認識樂器 × 動手演奏 × 發現聲音</p></div></div>
    <div class="badge">⭐ 今日任務：演奏 8 個音符</div>
  </header>

  <div class="grid">
    <aside class="card">
      <h2>🎒 選一種樂器</h2>
      <div class="instrument-list">
        <button class="inst active" data-inst="piano"><span class="inst-icon">🎹</span><span><strong>鋼琴</strong><small>鍵盤樂器</small></span></button>
        <button class="inst" data-inst="drum"><span class="inst-icon">🥁</span><span><strong>鼓</strong><small>打擊樂器</small></span></button>
        <button class="inst" data-inst="guitar"><span class="inst-icon">🎸</span><span><strong>吉他</strong><small>弦樂器</small></span></button>
        <button class="inst" data-inst="xylophone"><span class="inst-icon">🌈</span><span><strong>木琴</strong><small>打擊樂器</small></span></button>
      </div>
      <div class="tip">💡 <b>小提示：</b>點擊樂器就會發出聲音！也可以試試鍵盤 <b>1～8</b>，看看你的節奏感如何。</div>
    </aside>

    <main class="card stage">
      <div class="stage-top">
        <div><h2 id="instrumentName">🎹 鋼琴</h2><p class="desc" id="desc">黑白鍵交錯，透過琴弦震動產生聲音。</p></div>
        <div class="controls">
          <button class="control-btn" id="soundBtn">🔊 音效：開</button>
          <div class="volume">🔉 <input id="volume" type="range" min="0" max="1" step=".05" value=".55"> 🔊</div>
        </div>
      </div>
      <div class="playground" id="playground">
        <div class="stars">
          <span class="star" style="left:8%;top:18%">✦</span><span class="star" style="left:84%;top:20%;animation-delay:.8s">✧</span>
          <span class="star" style="left:15%;top:72%;animation-delay:1.5s">•</span><span class="star" style="left:91%;top:73%;animation-delay:2.2s">✦</span>
        </div>
        <div class="instrument-wrap" id="instrumentWrap"></div>
        <div class="particles" id="particles"></div>
      </div>
      <div class="action-row">
        <div class="hint" id="hint">🎹 點擊琴鍵演奏，也可按 1～8</div>
        <div class="score">音符：<span id="score">0</span> / 8</div>
      </div>
      <div class="meter"><i id="meter"></i></div>
    </main>
  </div>
</div>

<script>
const state={instrument:"piano",sound:true,volume:.55,score:0,audio:null};
const data={
 piano:{name:"🎹 鋼琴",desc:"黑白鍵交錯，透過琴弦震動產生聲音。",hint:"🎹 點擊琴鍵演奏，也可按 1～8",
   notes:[261.63,293.66,329.63,349.23,392,440,493.88,523.25]},
 drum:{name:"🥁 鼓",desc:"敲擊鼓面產生震動，是充滿節奏感的打擊樂器。",hint:"🥁 點鼓面或按 1～4 打節拍",
   notes:[110,130.81,146.83,164.81]},
 guitar:{name:"🎸 吉他",desc:"撥動琴弦讓它震動，弦的長短與粗細會影響音高。",hint:"🎸 撥動琴弦，也可按 1～6",
   notes:[196,220,246.94,293.66,329.63,392]},
 xylophone:{name:"🌈 木琴",desc:"不同長度的木條會產生不同音高，像彩虹一樣排列。",hint:"🌈 敲擊彩色琴鍵，試著排出自己的旋律",
   notes:[261.63,293.66,329.63,349.23,392,440]}
};

const wrap=document.getElementById("instrumentWrap"), particles=document.getElementById("particles");
const scoreEl=document.getElementById("score"), meter=document.getElementById("meter");

function buildInstrument(){
  const type=state.instrument; wrap.innerHTML="";
  if(type==="piano"){
    const art=document.createElement("div"); art.className="instrument-art piano";
    for(let i=0;i<8;i++){let k=document.createElement("div");k.className="white-key";k.dataset.i=i;art.appendChild(k)}
    [1,2,3,4,5].forEach((n,i)=>{let b=document.createElement("div");b.className="black-key b"+(i+1);b.dataset.i=n;art.appendChild(b)});
    wrap.appendChild(art); art.addEventListener("pointerdown",e=>{let k=e.target.closest("[data-i]");if(k)play(+k.dataset.i,k)});
  } else if(type==="drum"){
    const art=document.createElement("div");art.className="instrument-art drum"; art.innerHTML='<div class="stick"></div><div class="stick r"></div>';
    wrap.appendChild(art);art.addEventListener("pointerdown",()=>play(0,art));
  } else if(type==="guitar"){
    const art=document.createElement("div");art.className="instrument-art guitar";
    art.innerHTML='<div class="neck"></div><div class="head"></div><div class="body"></div><div class="hole"></div>'+
      '<div class="string"></div><div class="string s2"></div><div class="string s3"></div><div class="string s4"></div><div class="string s5"></div><div class="string s6"></div>';
    wrap.appendChild(art);art.addEventListener("pointerdown",e=>{let rect=art.getBoundingClientRect();let i=Math.min(5,Math.max(0,Math.floor((e.clientY-rect.top)/50)));play(i,art)});
  } else {
    const art=document.createElement("div");art.className="instrument-art xylophone";
    for(let i=0;i<6;i++){let b=document.createElement("div");b.className="bar";b.dataset.i=i;art.appendChild(b)}
    let m=document.createElement("div");m.className="mallet";art.appendChild(m);wrap.appendChild(art);
    art.addEventListener("pointerdown",e=>{let b=e.target.closest(".bar");if(b){m.classList.add("hit");setTimeout(()=>m.classList.remove("hit"),140);play(+b.dataset.i,b)}})
  }
  document.getElementById("instrumentName").textContent=data[type].name;
  document.getElementById("desc").textContent=data[type].desc;
  document.getElementById("hint").textContent=data[type].hint;
}
function getAudio(){
  if(!state.audio)state.audio=new (window.AudioContext||window.webkitAudioContext)();
  if(state.audio.state==="suspended")state.audio.resume(); return state.audio;
}
function tone(freq,duration=.28){
  if(!state.sound)return;
  const a=getAudio(),o=a.createOscillator(),g=a.createGain();
  o.type=state.instrument==="drum"?"sine":"triangle";o.frequency.value=freq;
  if(state.instrument==="drum")o.frequency.exponentialRampToValueAtTime(48,a.currentTime+duration);
  g.gain.setValueAtTime(.0001,a.currentTime);g.gain.exponentialRampToValueAtTime(Math.max(.02,state.volume*.16),a.currentTime+.012);
  g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+duration);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+duration+.03);
}
function play(i,el){
  const notes=data[state.instrument].notes; i=i%notes.length;tone(notes[i],state.instrument==="drum"?.45:.3);
  el.classList.remove("pulse","on");void el.offsetWidth;el.classList.add("pulse","on");setTimeout(()=>el.classList.remove("on"),170);
  state.score=Math.min(8,state.score+1);scoreEl.textContent=state.score;meter.style.width=(state.score/8*100)+"%";spawnNotes();
  if(state.score===8)setTimeout(()=>celebrate(),250);
}
function spawnNotes(){
  const symbols=["♪","♫","♩","✦","♬"],n=document.createElement("div");n.className="note";n.textContent=symbols[Math.floor(Math.random()*symbols.length)];
  n.style.left=(35+Math.random()*30)+"%";n.style.top=(52+Math.random()*18)+"%";n.style.setProperty("--drift",(Math.random()*90-45)+"px");particles.appendChild(n);setTimeout(()=>n.remove(),950)
}
function celebrate(){
  for(let i=0;i<12;i++)setTimeout(spawnNotes,i*65);
}
document.querySelectorAll(".inst").forEach(btn=>btn.addEventListener("click",()=>{
  document.querySelectorAll(".inst").forEach(x=>x.classList.remove("active"));btn.classList.add("active");
  state.instrument=btn.dataset.inst;buildInstrument();
}));
document.getElementById("soundBtn").addEventListener("click",e=>{
  state.sound=!state.sound;e.currentTarget.textContent=state.sound?"🔊 音效：開":"🔇 音效：關";
});
document.getElementById("volume").addEventListener("input",e=>state.volume=+e.target.value);
document.addEventListener("keydown",e=>{
  if(e.repeat)return;const k="12345678".indexOf(e.key);if(k>=0){let art=wrap.querySelector(".instrument-art");let targets=wrap.querySelectorAll("[data-i]");if(targets.length)play(k,targets[k%targets.length]);else play(k,art)}
});
buildInstrument();
</script>
</body>
</html>
